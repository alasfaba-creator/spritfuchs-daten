name: Preisverlauf aktualisieren

on:
  schedule:
    - cron: "17 3 * * *"   # täglich ca. 04:17 / 05:17 Uhr deutscher Zeit
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  osm:
    name: OSM ${{ matrix.region }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2          # höchstens 2 gleichzeitige Abfragen an Overpass
      matrix:
        region: [DEN, DES, AT, FRN, FRS]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ausstattung und Zahlarten aus OpenStreetMap
        run: python scripts/osm_tiles.py out ${{ matrix.region }}
      - uses: actions/upload-artifact@v4
        with:
          name: osm-${{ matrix.region }}
          path: out
          retention-days: 2

  build:
    needs: osm
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: osm-*
          path: osmparts

      - name: OSM Kacheln zusammenführen
        run: |
          mkdir -p site
          cp -r public/. site/ 2>/dev/null || true
          python scripts/merge_osm.py osmparts site

      - name: Tankerkönig Archiv holen (nur die letzten Wochen)
        id: archive
        env:
          TK_ARCHIVE_URL: ${{ secrets.TK_ARCHIVE_URL }}
        run: |
          if [ -z "$TK_ARCHIVE_URL" ]; then
            echo "::warning::Secret TK_ARCHIVE_URL fehlt noch. Preisverlauf wird übersprungen."
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          git clone --filter=blob:none --no-checkout --depth 1 "$TK_ARCHIVE_URL" archive
          cd archive
          git sparse-checkout init --no-cone
          PATTERNS=""
          for m in 0 1; do
            YM=$(date -u -d "$(date -u +%Y-%m-15) -$m month" +%Y/%m)
            PATTERNS="$PATTERNS /prices/$YM/ /stations/$YM/"
          done
          git sparse-checkout set $PATTERNS
          git checkout
          ls prices/*/* | tail -3

      - name: Preisverlauf Kacheln bauen
        if: steps.archive.outputs.ok == 'true'
        run: python scripts/build_tiles.py --archive archive --out site --days 7

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
